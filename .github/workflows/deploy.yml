name: Deploy

on:
  push:
    branches: [main]
  # Lo dispara la Edge Function `cargar-datos` tras una carga
  repository_dispatch:
    types: [datos-actualizados]
  # Lo llama diario.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Capa pública: lee SOLO las vistas anonimizadas con el rol de solo lectura.
      # Si falla la verificación, el despliegue se detiene y el sitio anterior queda como está.
      - name: Generar publico.json
        run: npm run generar-publico
        env:
          PUBLICO_DB_URL: ${{ secrets.PUBLICO_DB_URL }}
          PUBLICO_DB_CA: ${{ secrets.PUBLICO_DB_CA }}

      - run: npm run build
        env:
          # Ambas son públicas por diseño (Settings > Secrets and variables > Actions > Variables).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
